- insert:
    - id: graph-memory
      name: '@123caiji/dsh-graph-memory'
      config:
        # 数据库位置。省略时插件默认使用 ~/.dsh/graph-memory/graph-memory.db；
        # 需要自定义时取消下一行注释并填入绝对路径。
        # dbPath: 'D:/dsh-data/graph-memory.db'
        extractionEnabled: true
        recallEnabled: true
        recallMaxNodes: 6
        recallMaxDepth: 2
        maintenanceInterval: 6
        # 语义向量召回是可选项：在启动 DSH 的环境里设置 GRAPH_MEMORY_EMBEDDING_*，
        # 然后取消下面这段注释。不配置时自动退化为 SQLite FTS5 关键词召回。
        # embedding:
        #   apiKeyEnv: GRAPH_MEMORY_EMBEDDING_API_KEY   # 环境变量名，不是密钥本身
        #   baseURL: https://api.openai.com/v1
        #   model: text-embedding-3-small
        #   dimensions: 1536
